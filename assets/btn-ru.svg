<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="56" viewBox="0 0 240 56" role="img" aria-labelledby="br-t">
  <title id="br-t">Русский</title>
  <defs>
    <linearGradient id="br-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33267a"/>
      <stop offset="1" stop-color="#191c4d"/>
    </linearGradient>
    <linearGradient id="br-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset=".55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="br-sheen" gradientUnits="userSpaceOnUse" x1="28" y1="0" x2="212" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="br-flag"><rect width="36" height="24" rx="4"/></clipPath>
  </defs>

  <!-- pill -->
  <rect x="1" y="1" width="238" height="54" rx="27" fill="url(#br-fill)" stroke="url(#br-rim)" stroke-width="2"/>
  <path d="M28 4.5H212" stroke="url(#br-sheen)" stroke-linecap="round"/>

  <!-- flag: Russian tricolour (white / blue / red), drawn with shapes (no emoji) -->
  <g transform="translate(58 16)">
    <g clip-path="url(#br-flag)">
      <rect width="36" height="8" fill="#ffffff"/>
      <rect y="8" width="36" height="8" fill="#0039a6"/>
      <rect y="16" width="36" height="8" fill="#d52b1e"/>
    </g>
    <rect x=".5" y=".5" width="35" height="23" rx="3.5" fill="none" stroke="#ffffff" stroke-opacity=".22"/>
  </g>

  <text x="110" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing=".2" fill="#ffffff">Русский</text>
</svg>
