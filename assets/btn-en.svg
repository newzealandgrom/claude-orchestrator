<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="56" viewBox="0 0 240 56" role="img" aria-labelledby="be-t">
  <title id="be-t">English</title>
  <defs>
    <linearGradient id="be-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33267a"/>
      <stop offset="1" stop-color="#191c4d"/>
    </linearGradient>
    <linearGradient id="be-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset=".55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="be-sheen" gradientUnits="userSpaceOnUse" x1="28" y1="0" x2="212" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="be-flag"><rect width="36" height="24" rx="4"/></clipPath>
    <!-- four triangles that get the red diagonals (the Union Jack counterchange) -->
    <clipPath id="be-red"><path d="M18 12h18v12zv12h-18zh-18v-12zv-12h18z"/></clipPath>
  </defs>

  <!-- pill -->
  <rect x="1" y="1" width="238" height="54" rx="27" fill="url(#be-fill)" stroke="url(#be-rim)" stroke-width="2"/>
  <path d="M28 4.5H212" stroke="url(#be-sheen)" stroke-linecap="round"/>

  <!-- flag: simplified Union Jack, drawn with shapes (no emoji) -->
  <g transform="translate(58 16)">
    <g clip-path="url(#be-flag)">
      <rect width="36" height="24" fill="#012169"/>
      <path d="M0 0L36 24M36 0L0 24" stroke="#ffffff" stroke-width="4.6"/>
      <path d="M0 0L36 24M36 0L0 24" stroke="#c8102e" stroke-width="2.4" clip-path="url(#be-red)"/>
      <path d="M18 0V24M0 12H36" stroke="#ffffff" stroke-width="7.6"/>
      <path d="M18 0V24M0 12H36" stroke="#c8102e" stroke-width="4.4"/>
    </g>
    <rect x=".5" y=".5" width="35" height="23" rx="3.5" fill="none" stroke="#ffffff" stroke-opacity=".22"/>
  </g>

  <text x="110" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing=".2" fill="#ffffff">English</text>
</svg>
