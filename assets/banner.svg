<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="bn-t bn-d">
  <title id="bn-t">Claude Orchestrator</title>
  <desc id="bn-d">A limit-aware AI team lead for Claude Code. A central conductor node is linked to ten specialist role nodes; a gauge row shows 5h 63%, 7d 22%, ctx 41%.</desc>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .flow{stroke-dasharray:2 9}
    .halo{transform-box:fill-box;transform-origin:center}
    @media (prefers-reduced-motion: no-preference){
      .flow{animation:bn-flow 2.4s linear infinite}
      .halo{animation:bn-pulse 3.6s ease-out infinite}
      .tw{animation:bn-tw 4.8s ease-in-out infinite}
      .gl{animation:bn-gl 4.8s ease-in-out infinite}
      @keyframes bn-flow{to{stroke-dashoffset:-22}}
      @keyframes bn-pulse{from{transform:scale(1);opacity:.6}to{transform:scale(2.1);opacity:0}}
      @keyframes bn-tw{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes bn-gl{0%,100%{opacity:.10}50%{opacity:.30}}
    }
  </style>
  <defs>
    <linearGradient id="bn-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b2e"/></linearGradient>
    <radialGradient id="bn-glow" gradientUnits="userSpaceOnUse" cx="1022" cy="160" r="340"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".32"/><stop offset=".5" stop-color="#6366f1" stop-opacity=".11"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <radialGradient id="bn-glow2" gradientUnits="userSpaceOnUse" cx="120" cy="330" r="360"><stop offset="0" stop-color="#6366f1" stop-opacity=".16"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <radialGradient id="bn-fade" gradientUnits="userSpaceOnUse" cx="1022" cy="160" r="300"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="bn-dotmask"><rect width="1280" height="320" fill="url(#bn-fade)"/></mask>
    <pattern id="bn-dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#8b949e"/></pattern>
    <linearGradient id="bn-title" gradientUnits="userSpaceOnUse" x1="270" y1="0" x2="640" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <radialGradient id="bn-line" gradientUnits="userSpaceOnUse" cx="1022" cy="160" r="215"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#22d3ee"/></radialGradient>
    <radialGradient id="bn-core" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#ddd6fe"/><stop offset=".45" stop-color="#8b5cf6"/><stop offset="1" stop-color="#4338ca"/></radialGradient>
    <radialGradient id="bn-coreglow"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".55"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <linearGradient id="bn-bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="bn-top" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1280" y2="0"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/><stop offset=".3" stop-color="#8b5cf6" stop-opacity=".8"/><stop offset=".75" stop-color="#22d3ee" stop-opacity=".7"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
    <clipPath id="bn-card"><rect width="1280" height="320" rx="20"/></clipPath>
